name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    # The host suite: pbtk against the real libpbagent, built with the
    # InkView stub (no PocketBook SDK needed).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Host tests
        run: make test
