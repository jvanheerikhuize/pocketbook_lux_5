[project]
name = "pbtk"
version = "0.1.0"
description = "PocketBook toolkit: deploy, probe, watch and drive apps on a PocketBook reader"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pbtk = "pbtk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pbtk*"]

[tool.setuptools.package-data]
pbtk = ["gui/static/*"]
